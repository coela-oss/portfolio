name: Site acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        site: ["coela"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install pinned package manager
        run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@10.29.3
      - name: Install the official registry dependency tree
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/site-store" --registry=https://registry.npmjs.org
      - run: pnpm validate:content
      - run: python3 -m unittest discover -s .github/scripts -p 'test_site_*.py'
      - run: pnpm test
      - run: pnpm site typecheck '${{ matrix.site }}'
      - run: pnpm site build '${{ matrix.site }}'
      - name: Type-check hosted browser tooling
        run: pnpm exec tsc --noEmit --strict --module NodeNext --moduleResolution NodeNext --target ES2022 --resolveJsonModule --allowImportingTsExtensions --skipLibCheck .github/scripts/browser-session.mts .github/scripts/browser-check.mts site/navigation.test.mts site/guidance.test.mts scripts/update-engineering.mts
      - name: Provide Japanese glyphs for faithful hosted screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
          fc-match -f '%{family}' 'sans-serif:lang=ja' | grep -F 'CJK'
      - name: Check rendered navigation, diagrams and responsive tables on hosted Chrome
        run: node .github/scripts/browser-check.mts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: portfolio-browser-${{ github.sha }}
          path: browser-results/
          retention-days: 14
          if-no-files-found: ignore
