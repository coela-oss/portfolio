name: Observe deployed assets without Cloudflare credentials
on:
  workflow_dispatch:
    inputs:
      release_run:
        description: Reviewed owning release run ID
        required: true
        type: string
      archive_sha256:
        description: Reviewed archive SHA256
        required: true
        type: string
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@10.29.3
      - name: Resolve the locked pure verifier before observing public assets
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Bind the reviewed owning archive without executing its contents
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_RELEASE_RUN_ID: ${{ inputs.release_run }}
          SITE_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: python3 .github/scripts/site_observe.py download "$RUNNER_TEMP/site-readback"
      - name: Observe public responses using the same hosted curl
        run: python3 .github/scripts/site_observe.py observe "$RUNNER_TEMP/site-readback"
      - name: Distinguish hosted blockers from separate local verification evidence
        if: always()
        run: python3 .github/scripts/site_observe.py summary "$RUNNER_TEMP/site-readback"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: public-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site-readback/results/
          if-no-files-found: ignore
          retention-days: 14
